name: cq-v4-local-qa
services:
  db:
    image: postgres:17-alpine@sha256:3540c0362c809df084ffac0ae69fe794515f9de92692f02178bcdce0ef0302ac
    env_file: runtime/db.env
    ports: ["127.0.0.1:54322:5432"]
    volumes:
      - cq_local_data:/var/lib/postgresql/data
      - ./runtime/00-roles.sql:/docker-entrypoint-initdb.d/00-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 2s
      retries: 30
  auth:
    image: public.ecr.aws/supabase/gotrue:v2.197.0
    env_file: runtime/auth.env
    ports: ["127.0.0.1:9999:9999"]
    depends_on:
      db: {condition: service_healthy}
  rest:
    image: public.ecr.aws/supabase/postgrest:v16.5
    env_file: runtime/rest.env
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      db: {condition: service_healthy}
volumes:
  cq_local_data:
