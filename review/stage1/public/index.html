  const job=prior.catch(()=>{}).then(work);

  return enqueue(id,async()=>{
   if(finalized.has(id))return {status:'finalized'};

async function extractFile(file){if(!file)return;try{let text='';if(file.name.toLowerCase().endsWith('.pdf')){if(!window.pdfjsLib)throw Error('PDF 읽기 라이브러리를 불러오지 못했습니다. TXT로 변환해 등록하세요.');const pdf=await pdfjsLib.getDocument({isEvalSupported:false,data:await file.arrayBuffer()}).promise;for(let i=1;i<=pdf.numPages;i++){let pg=await pdf.getPage(i),tc=await pg.getTextContent();text+=tc.items.map(x=>x.str).join(' ')+'\n'}}else{text=await file.text()}$('#sourceText').value=text;setStatus('AI 문제용 텍스트 '+text.length+'자 추출. 텍스트 저장을 눌러주세요.')}catch(e){alert(e.message)}}
function download(name,content,type='application/json'){const blob=content instanceof Blob?content:new Blob([content],{type});const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),10000)}

function cqValidateAIDraft(d){
 if(!d||!Array.isArray(d.questions)||!d.questions.length||d.questions.length>30)return '문제는 1~30개여야 합니다.';
 if(!Array.isArray(d.vocabulary)||d.vocabulary.length>100)return '단어 목록 형식이 잘못되었습니다.';
 for(const [i,q] of d.questions.entries()){
  if(!q||typeof q.text!=='string'||!q.text.trim()||q.text.length>2000)return `${i+1}번 문제 내용을 확인하세요.`;
  if(q.kind==='mc'){
   if(!Array.isArray(q.options)||q.options.length<2||q.options.length>6||q.options.some(o=>typeof o!=='string'||!o.trim()||o.length>500))return `${i+1}번 선택지를 확인하세요.`;
   if(!Number.isInteger(q.correct)||q.correct<0||q.correct>=q.options.length)return `${i+1}번 정답 번호를 확인하세요.`;
  }
 }
 for(const v of d.vocabulary){if(!v||typeof v.word!=='string'||!v.word.trim()||typeof v.meaning!=='string'||!v.meaning.trim())return '단어와 뜻을 확인하세요.';}
 return '';
}

<script>
/* Chapter Quest V4: optional authenticated cloud sync adapter.
   A Supabase user must sign in via a future auth UI; no service-role key is ever used. */
window.CQCloud = (() => {
  let config=null, accessToken=null, userId=null, beforeRequest=null, epoch=0;
  const inFlight=new Set();
  function abortInFlight(){for(const controller of inFlight)controller.abort();inFlight.clear()}
  const api=async(path,options={})=>{
    // Bind the request to the account active at invocation time.
    const requestEpoch=epoch, requestUser=userId, requestConfig=config;
    const hook=beforeRequest;
    if(!requestConfig||!requestUser||!accessToken)throw Error('클라우드 로그인이 필요합니다.');
    if(hook)await hook();
    if(epoch!==requestEpoch||userId!==requestUser||config!==requestConfig||!accessToken)
      throw Error('로그인 계정이 변경되어 이전 요청을 전송하지 않았습니다.');
    const token=accessToken;
    const controller=new AbortController();
    inFlight.add(controller);
    // The caller may provide a signal; forward its cancellation without dropping
    // our own account-switch cancellation boundary.
    const callerSignal=options.signal;
    const onCallerAbort=()=>controller.abort();
    if(callerSignal?.aborted)controller.abort();
    else callerSignal?.addEventListener('abort',onCallerAbort,{once:true});
    try{
      if(epoch!==requestEpoch||userId!==requestUser)throw Error('로그인 계정이 변경되었습니다.');
      const response=await fetch(requestConfig.url.replace(/\/$/,'')+'/rest/v1/'+path,{
        ...options,signal:controller.signal,headers:{apikey:requestConfig.anonKey,Authorization:'Bearer '+token,
          'Content-Type':'application/json',...(options.headers||{})}
      });
      if(epoch!==requestEpoch||userId!==requestUser)throw Error('로그인 계정이 변경되어 이전 응답을 폐기했습니다.');
      return response;
    }finally{
      inFlight.delete(controller);
      callerSignal?.removeEventListener('abort',onCallerAbort);
    }
  };
  function configure({url,anonKey,token,uid}){
    if(!/^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(url))throw Error('Supabase 프로젝트 주소를 확인하세요.');
    if(!anonKey||!token||!uid)throw Error('인증 정보가 필요합니다.');
    abortInFlight();epoch++;config={url,anonKey};accessToken=token;userId=uid;
  }
  function reset(){abortInFlight();epoch++;config=null;accessToken=null;userId=null;beforeRequest=null}
  function setBeforeRequest(callback){beforeRequest=callback}
  function updateToken(token){if(!config||!userId)throw Error('로그인이 필요합니다.');accessToken=token}
  async function push(state){
    if(!userId)throw Error('클라우드 로그인이 필요합니다.');
    const owner=userId;
    const safe=JSON.parse(JSON.stringify(state));
    delete safe.code;
    const response=await api('cq_v4_snapshots?on_conflict=owner_id',{
      method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=representation'},
      body:JSON.stringify({owner_id:owner,payload:safe,updated_at:new Date().toISOString()})
    });
    if(!response.ok)throw Error('클라우드 저장 실패: '+response.status);
    return (await response.json())[0];
  }
  async function pull(){
    if(!userId)throw Error('클라우드 로그인이 필요합니다.');
    const owner=userId;
    const response=await api('cq_v4_snapshots?select=payload,updated_at&owner_id=eq.'+encodeURIComponent(owner),{method:'GET'});
    if(!response.ok)throw Error('클라우드 불러오기 실패: '+response.status);
    const rows=await response.json();
    return rows[0]||null;
  }
  async function pushIfUnchanged(current, expected){
    if(!userId)throw Error('로그인이 필요합니다.');
    const owner=userId;
    const safe=JSON.parse(JSON.stringify(current));delete safe.code;
    let response;
    if(expected===null){
      response=await api('cq_v4_snapshots',{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify({owner_id:owner,payload:safe,updated_at:new Date().toISOString()})});
      if(response.status===409)return {conflict:true};
    }else{
      response=await api('cq_v4_snapshots?owner_id=eq.'+encodeURIComponent(owner)+'&updated_at=eq.'+encodeURIComponent(expected),{method:'PATCH',headers:{Prefer:'return=representation'},body:JSON.stringify({payload:safe,updated_at:new Date().toISOString()})});
    }
    if(!response.ok)throw Error('클라우드 저장 실패: '+response.status);
    const rows=await response.json();
    return rows.length?{conflict:false,snapshot:rows[0]}:{conflict:true};
  }
  return {configure,reset,setBeforeRequest,updateToken,push,pull,pushIfUnchanged};
})();

}

  async saveParentSnapshot(snapshot,expectedRevision){ensure();if(principal.role!=='parent')throw Error('Parent role required');if(!snapshot||typeof snapshot!=='object'||Array.isArray(snapshot))throw Error('Invalid snapshot');const safe=clone(snapshot);delete safe.code;

  async submission(chapterId){ensure();if(principal.role!=='student')throw Error('Student role required');if(typeof chapterId!=='string'||!chapterId)throw Error('Chapter ID required');if(mode==='cloud')return guarded(studentApi.submission(chapterId));return clone(localRead()?.submissions?.[chapterId]??null)},
  async submit(chapterId,answers){ensure();if(principal.role!=='student')throw Error('Student role required');if(typeof chapterId!=='string'||!chapterId)throw Error('Chapter ID required');if(!answers||typeof answers!=='object'||Array.isArray(answers))throw Error('Answers object required');if(mode==='cloud')return guarded(studentApi.submit(chapterId,clone(answers)));

 function publicationPayload(c){
   if(!c||!Array.isArray(c.questions)||!c.questions.length)throw Error('승인된 문제가 없습니다.');
   const questions=[],answerKey=[];
   for(const q of c.questions){
     const kind=String(q.kind||''),text=String(q.text||'').trim();
     if(!['mc','inference','critical','short','comprehension'].includes(kind)||!text)throw Error('지원되지 않는 문제 형식입니다.');
     if(kind==='mc'){
       if(!Array.isArray(q.options)||q.options.length<2||q.options.length>6||q.options.some(x=>typeof x!=='string'||!x.trim())||!Number.isInteger(q.correct)||q.correct<0||q.correct>=q.options.length)throw Error('객관식 정답 또는 선택지가 올바르지 않습니다.');
       questions.push({kind,text,options:q.options.map(x=>x.trim())});answerKey.push(q.correct);
     }else{
       const sample=String(q.sample||q.answer||'').trim();
       if(!sample)throw Error('서술형 모범 답안이 누락되었습니다.');
       questions.push({kind,text});answerKey.push(sample);
     }
   }
   return {questions,answerKey};
 }

(function(root){
  function createStudentAPI({url,anonKey,getAccessToken,fetchImpl=fetch}){
    if(!/^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(url||'')) throw Error('Invalid Supabase URL');

    async function rpc(name,args={},options={}){
      const signal=options.signal;
      if(signal?.aborted)throw new DOMException('학생 요청이 취소되었습니다.','AbortError');

      if(signal?.aborted)throw new DOMException('학생 요청이 취소되었습니다.','AbortError');
      if(!token)throw Error('Student login required');
      const response=await fetchImpl(url+'/rest/v1/rpc/'+name,{
        method:'POST',headers:{apikey:anonKey,Authorization:'Bearer '+token,'Content-Type':'application/json'},
        body:JSON.stringify(args),signal

      chapterActivities:(chapterUuid,options={})=>rpc('cq_v4_my_chapter_activities',{p_chapter_uuid:chapterUuid},options),

      submission:(chapterUuid,options={})=>rpc('cq_v4_my_submission',{p_chapter_uuid:chapterUuid},options)

  }

     const input=form.querySelector(`[name="cqAnswer${i}"]:checked`)||form.querySelector(`textarea[name="cqAnswer${i}"]`);
     if(!input||!String(input.value).trim()){status((i+1)+'번 문제에 답변해 주세요.');return;}
     answers.push(input.value);
   }
   const essay=form.elements.namedItem('essay')?.value?.trim();
   const speaking=form.elements.namedItem('speaking')?.value?.trim();
   if(!form.elements.namedItem('readComplete')?.checked||!essay||!speaking){status('읽기 완료, 독후감, 말하기 대본을 모두 작성하세요.');return;}
   if(voiceRecorder?.state==='recording'){status('녹음을 종료한 뒤 제출하세요.');return;}
   if(voiceSavePending){status('녹음 원본 저장이 끝난 뒤 제출하세요.');return;}
   if(unsavedVoice?.uid===session.uid&&unsavedVoice?.uuid===uuid){status('녹음 원본 저장이 완료되지 않았습니다. 녹음 저장 재시도를 눌러주세요.');return;}
   if(voiceBlob&&voiceChapter!==uuid){status('현재 챕터와 녹음 파일이 일치하지 않습니다.');return;}
   if(!voiceBlob&&!readRecovery(session.uid,uuid)){status('말하기 녹음을 완료한 뒤 제출하세요.');return;}
   if(!confirm('제출 후에는 답변을 수정할 수 없습니다. 제출할까요?'))return;
   // Persist the exact answers before any network request: an aborted request,
   // logout, or lost response must not discard a completed answer draft.
   try{writeDraft(session.uid,uuid,form)}
   catch(error){status('답변 임시저장 실패로 제출을 중단했습니다: '+error.message);return;}
   try{await childAccessToken()}catch(error){status(error.message);return;}
   const context=childContext();
   const submitController=new AbortController();activeChildSubmit=submitController;
   busy=true;const button=form.querySelector('[type="submit"]');if(button)button.disabled=true;
   try{
     const existing=await childApi.submission(uuid,{signal:submitController.signal});
     assertChildContext(context);
     if(Array.isArray(existing)?existing.length:!!existing){
       try{submissionGate.markConfirmed(context.uid,uuid)}catch(err){console.warn('Submission marker unavailable:',err?.name||'UNKNOWN');}
       // The previous submit may have committed while its response was lost.
       // Only a confirmed server submission permits local recovery cleanup.
       uploadedAudio.delete(session.uid+'/'+uuid);
       clearRecovery(session.uid,uuid);
       clearDraft(session.uid,uuid);
       const audioCleanupOk=await cleanupConfirmedAudio(context.uid,uuid,context);
       assertChildContext(context);
       voiceBlob=null;voiceChapter=null;
       status('서버에 이미 제출된 답변이 확인되었습니다. 중복 제출하지 않았습니다.'+(audioCleanupOk?'':' 이 기기의 녹음 파일 정리는 실패했습니다. 저장 공간을 확인하세요.'));
       const detail=el('cqChildDetail');
       if(detail)detail.innerHTML='<p>제출 완료. 피드백은 부모 검토 후 공개됩니다.</p>';
       return;
     }
     const pending=readRecovery(context.uid,uuid);
     let confirmedAudio=false;
     if(pending){
       // An upload intent is not evidence of a successful upload. Verify on server.
       confirmedAudio=await verifyExistingAudio(context.uid,uuid,pending.ext,pending.sha256);
       assertChildContext(context);
       if(confirmedAudio)writeRecovery(context.uid,uuid,pending.ext,'uploaded',pending.sha256);
       else if(pending.phase!=='uploading')throw Error('이전 녹음 파일을 서버에서 확인하지 못했습니다. 제출을 중단합니다.');
       else if(!voiceBlob)throw Error('이전 녹음 업로드가 완료되지 않았습니다. 녹음 데이터가 남아 있지 않아 자동 복구할 수 없습니다.');
     }
     if(voiceBlob&&!confirmedAudio){
       if(voiceBlob.size>10485760)throw Error('녹음 파일은 10MB 이하여야 합니다.');
       const config=window.CQProject.read();
       if(!config?.url||!config?.anonKey)throw Error('Supabase 프로젝트 설정이 없습니다.');
       const ext=voiceBlob.type.includes('mp4')?'mp4':voiceBlob.type.includes('ogg')?'ogg':'webm';
       if(pending&&pending.ext!==ext)throw Error('이전 업로드 시도와 녹음 형식이 다릅니다. 안전을 위해 제출을 중단합니다.');
       const sha256=await audioSha256(voiceBlob);
       assertChildContext(context);
       if(pending&&pending.sha256!==sha256)throw Error('기존 업로드 시도와 새 녹음의 내용이 다릅니다. 안전을 위해 제출을 중단합니다.');
       const path=context.uid+'/'+uuid+'.'+ext;
       // If no durable prior intent exists, a 409 must never adopt an unknown object.
       const hadPriorIntent=!!pending;
       // Write durable intent BEFORE the network call. A lost success response
       // can then be recovered by verifying this exact object on next login.
       writeRecovery(context.uid,uuid,ext,'uploading',sha256);
       const uploadController=new AbortController();activeChildUpload=uploadController;
       const upload=await fetch(config.url+'/storage/v1/object/cq-v4-speaking/'+path,{
         method:'POST',headers:{apikey:config.anonKey,Authorization:'Bearer '+session.token,
           'Content-Type':voiceBlob.type,'x-upsert':'false'},
         body:voiceBlob,signal:uploadController.signal
       });
       assertChildContext(context);
       if(activeChildUpload===uploadController)activeChildUpload=null;
       if(!upload.ok){
         if(upload.status===409){
           if(!hadPriorIntent)throw Error('이전에 기록되지 않은 녹음 파일이 서버에 있습니다. 안전을 위해 재사용하지 않습니다.');
           // Reuse only when this account/chapter has a durable prior intent
           // and the exact server object can be independently verified.
           confirmedAudio=await verifyExistingAudio(context.uid,uuid,ext,sha256);
           assertChildContext(context);
           if(!confirmedAudio)throw Error('기존 녹음 파일을 확인하지 못했습니다. 덮어쓰지 않고 제출을 중단합니다.');
         }else{
           const detail=await upload.json().catch(()=>({}));
           throw Error('녹음 업로드 실패: '+(detail.message||upload.status));
         }
       }else confirmedAudio=true;
       if(confirmedAudio){uploadedAudio.add(context.uid+'/'+uuid);writeRecovery(context.uid,uuid,ext,'uploaded',sha256);}
     }
     if(!confirmedAudio)throw Error('서버에 녹음 파일이 확인되지 않아 제출할 수 없습니다.');
     assertChildContext(context);
     await childApi.submit(uuid,{readComplete:true,answers,essay,speaking,hasAudio:confirmedAudio},{signal:submitController.signal});
     assertChildContext(context);
     try{submissionGate.markConfirmed(context.uid,uuid)}catch(err){console.warn('Submission marker unavailable:',err?.name||'UNKNOWN');}
     uploadedAudio.delete(session.uid+'/'+uuid);clearRecovery(session.uid,uuid);clearDraft(session.uid,uuid);const audioCleanupOk=await cleanupConfirmedAudio(context.uid,uuid,context);assertChildContext(context);voiceBlob=null;voiceChapter=null;status('제출 완료. 부모 피드백은 공개 후 확인할 수 있습니다.'+(audioCleanupOk?'':' 이 기기의 녹음 파일 정리는 실패했습니다. 저장 공간을 확인하세요.'));
     const detail=el('cqChildDetail');if(detail)detail.innerHTML='<p>제출 완료. 피드백은 부모 검토 후 공개됩니다.</p>';
   }catch(err){
     if(session?.uid===context.uid&&childGeneration===context.generation){
       status('제출 실패: '+err.message+(readRecovery(context.uid,uuid)?' · 서버에 업로드된 녹음 기록이 보존되었습니다. 다시 로그인해 제출할 수 있습니다.':''));
     }
   }finally{if(activeChildSubmit===submitController)activeChildSubmit=null;if(session?.uid===context.uid&&childGeneration===context.generation){activeChildUpload=null;busy=false;if(button?.isConnected)button.disabled=false}}
 });
 // Never retain a child token in localStorage; a page reload requires login again.
 const initialRender=render;render=function(){initialRender()};
})();
</script><script>/* Stage42 standalone client bridge. Requires a signed-in Supabase Auth session. */
(function(root){
  async function rpc({url,anonKey,getAccessToken},fn,params={}){
    if(!/^https:\/\//.test(url||''))throw Error('HTTPS Supabase URL required');
    if(!anonKey)throw Error('Supabase publishable/anon key required');
    const token=await getAccessToken?.();
    if(!token)throw Error('Authentication required');
    const res=await fetch(url.replace(/\/$/,'')+'/rest/v1/rpc/'+fn,{
      method:'POST',headers:{apikey:anonKey,Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify(params)
    });
    if(!res.ok){const err=await res.json().catch(()=>({}));throw Error(err.message||`RPC ${res.status}`)}
    return res.json();
  }
  root.CQInvitationAPI={
    issue:(cfg)=>rpc(cfg,'cq_v4_issue_invite'),
    claim:(cfg,code,name)=>rpc(cfg,'cq_v4_claim_invite',{p_token:code,p_student_name:name}),
    approve:(cfg,childId)=>rpc(cfg,'cq_v4_approve_child',{p_child_user_id:childId}),
    revoke:(cfg,childId)=>rpc(cfg,'cq_v4_revoke_child',{p_child_user_id:childId})
  };
})(typeof window==='undefined'?globalThis:window);
</script><script>/* Stage 132: explicit student workflow separation. This is a UI boundary, NOT an RLS boundary. */
(function(root){
 'use strict';
 const MODES=Object.freeze({DEMO:'local-demo',SERVER:'server'});
 function createMode(initial=MODES.DEMO){
  if(!Object.values(MODES).includes(initial))throw Error('Invalid student mode');
  let current=initial;
  return Object.freeze({get:()=>current,set(next){if(!Object.values(MODES).includes(next))throw Error('Invalid student mode');current=next;return current},isServer:()=>current===MODES.SERVER});
 }
 function serverOnlyMarkup(){return '<section class="card"><h3>학습 순서</h3><p>내 배정 챕터를 불러오고 원문을 읽은 뒤, 문제·독후감·말하기를 완료해 제출하세요. 제출한 답변은 수정할 수 없으며 부모가 공개한 피드백을 확인할 수 있습니다.</p></section>'}
 root.CQStudentMode132=Object.freeze({MODES,createMode,serverOnlyMarkup});
 if(typeof module!=='undefined')module.exports={MODES,createMode,serverOnlyMarkup};
})(typeof window!=='undefined'?window:globalThis);
</script>
<script>
/* Stage 132 UI integration. Default stays local demo to preserve existing files. */
(()=>{
 const gate=CQStudentMode132.createMode();
 const oldStudentUI=studentUI;
 studentUI=function(){return gate.isServer()?CQStudentMode132.serverOnlyMarkup():oldStudentUI()};
 const previousRender=render;
 render=function(){
   previousRender();
   const studentScreen=mode==='student';
   const selector=document.getElementById('student');
   if(selector){const label=selector.closest('label');if(label){label.hidden=studentScreen&&gate.isServer();label.style.display=studentScreen&&gate.isServer()?'none':'';}}
   if(!studentScreen)return;
   const panel=document.getElementById('cqChildAccount');
   if(!panel)return;
   const switcher=document.createElement('section');
   switcher.className='card';switcher.id='cqStage132ModeSwitch';
   switcher.innerHTML='<h2>학습 저장 방식</h2><div class="row"><button type="button" data-stage132="local-demo">기기 데모</button><button type="button" data-stage132="server">학생 서버 학습</button></div><p class="muted" id="cqStage132ModeStatus"></p>';
   panel.before(switcher);
   const s=switcher.querySelector('#cqStage132ModeStatus');
   s.textContent=gate.isServer()?'학생 본인의 계정으로 배정된 챕터를 학습합니다.':'기기 데모: 로컬 학습 기록이며 서버 동기화되지 않습니다.';
   for(const b of switcher.querySelectorAll('[data-stage132]')){
     b.classList.toggle('active',b.dataset.stage132===gate.get());
   }
   // The existing server account panel remains available only in server mode.
   panel.hidden=!gate.isServer();
 };
 document.addEventListener('click',event=>{
   const b=event.target.closest?.('[data-stage132]');if(!b)return;
   event.preventDefault();
   if(mode!=='student')return;
   const next=b.dataset.stage132;
   if(next===gate.get())return;
   gate.set(next);view='home';tab='read';selectedBook='';selectedChapter='';audioBlob=null;
   render();
 });
 // Stop accidental demo actions when the server-only screen is selected.
 document.addEventListener('click',event=>{
   if(mode!=='student'||!gate.isServer())return;
   if(event.target.closest?.('[data-act]')){event.stopImmediatePropagation();event.preventDefault();}
 },true);
 window.CQStage132Mode=gate;
 render();
})();

<script>
/* Chapter Quest V4: authenticated, fail-closed server PDF transport.
   Backend Edge Function cq-v4-pdf-link must enforce student assignment and return
   {signed_url, expires_at}. No browser-side access check is a substitute for RLS. */
(function(root){
  function createPdfTransport({url,anonKey,getAccessToken,fetchImpl=fetch,now=()=>Date.now()}){
    if(!/^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(url||''))throw Error('INVALID_SUPABASE_ORIGIN');
    if(!anonKey||typeof getAccessToken!=='function'||typeof fetchImpl!=='function')throw Error('INVALID_PDF_TRANSPORT_CONFIG');
    async function getPdf(chapterUuid,{signal}={}){
      if(!/^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(chapterUuid||''))throw Error('INVALID_CHAPTER_UUID');
      if(signal?.aborted)throw Error('PDF_REQUEST_CANCELLED');
      const token=await getAccessToken();
      if(!token)throw Error('STUDENT_LOGIN_REQUIRED');
      const rpcResponse=await fetchImpl(url+'/functions/v1/cq-v4-pdf-link',{
        method:'POST',headers:{apikey:anonKey,Authorization:'Bearer '+token,'Content-Type':'application/json'},
        body:JSON.stringify({chapter_uuid:chapterUuid}),signal
      });
      if(!rpcResponse.ok)throw Error('PDF_ACCESS_DENIED_OR_UNAVAILABLE');
      const payload=await rpcResponse.json();
      const link=Array.isArray(payload)?payload[0]:payload;
      if(!link?.signed_url||!link?.expires_at)throw Error('PDF_LINK_NOT_AVAILABLE');
      const signed=new URL(link.signed_url,url);
      const base=new URL(url);
      if(signed.origin!==base.origin||!signed.pathname.startsWith('/storage/v1/object/sign/cq-v4-originals/'))throw Error('UNTRUSTED_PDF_URL');
      if(!signed.searchParams.has('token'))throw Error('UNSIGNED_PDF_URL');
      const expires=Date.parse(link.expires_at);
      if(!Number.isFinite(expires)||expires<=now()+5000||expires>now()+10*60*1000)throw Error('INVALID_PDF_LINK_EXPIRY');
      if(signal?.aborted)throw Error('PDF_REQUEST_CANCELLED');
      const response=await fetchImpl(signed.toString(),{method:'GET',signal,headers:{apikey:anonKey,Authorization:'Bearer '+token}});
      if(!response.ok)throw Error('PDF_DOWNLOAD_FAILED');
      const type=(response.headers?.get('content-type')||'').toLowerCase();
      if(type&&!type.includes('application/pdf')&&!type.includes('octet-stream'))throw Error('INVALID_PDF_CONTENT_TYPE');
      // Reject oversized responses before allocating, then enforce the same limit while streaming.
      const maxPdfBytes=50*1024*1024;
      const declaredLength=response.headers?.get('content-length');
      if(declaredLength!==null&&declaredLength!==undefined&&declaredLength!==''){
        const declared=Number(declaredLength);
        if(!Number.isSafeInteger(declared)||declared<5||declared>maxPdfBytes)throw Error('INVALID_PDF_SIZE');
      }
      let bytes;
      if(response.body&&typeof response.body.getReader==='function'){
        const reader=response.body.getReader(),chunks=[];
        let total=0;
        try{
          while(true){
            if(signal?.aborted)throw Error('PDF_REQUEST_CANCELLED');
            const {done,value}=await reader.read();
            if(done)break;
            if(!(value instanceof Uint8Array))throw Error('INVALID_PDF_STREAM');
            total+=value.byteLength;
            if(total>maxPdfBytes)throw Error('INVALID_PDF_SIZE');
            chunks.push(value);
          }
        }catch(error){try{await reader.cancel()}catch{}throw error}
        if(total<5)throw Error('INVALID_PDF_SIZE');
        const merged=new Uint8Array(total);
        let offset=0;
        for(const chunk of chunks){merged.set(chunk,offset);offset+=chunk.byteLength}
        bytes=merged.buffer;
      }else{
        bytes=await response.arrayBuffer();
        if(bytes.byteLength<5||bytes.byteLength>maxPdfBytes)throw Error('INVALID_PDF_SIZE');
      }
      const header=new Uint8Array(bytes,0,5);
      if(String.fromCharCode(...header)!=='%PDF-')throw Error('INVALID_PDF_SIGNATURE');
      if(signal?.aborted)throw Error('PDF_REQUEST_CANCELLED');
      return bytes;
    }
    return Object.freeze({getPdf});
  }
  root.CQServerPDF=Object.freeze({createPdfTransport});
  if(typeof module!=='undefined'&&module.exports)module.exports={createPdfTransport};
})(typeof window!=='undefined'?window:globalThis);

</script>
