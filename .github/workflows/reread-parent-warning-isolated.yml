name: Reread parent warning isolated verification
on:
  push:
    branches:
      - work/reread-parent-workflow-20261120
      - work/parent-material-workflow-12step-20261121
    paths:
      - 'app/sql/development-parent-lesson-context-not-for-production.sql'
      - 'app/tests/isolated-postgres-parent-lesson.sql'
      - 'app/tests/reread-parent-warning.test.cjs'
      - 'app/public/js/parent-app.js'
      - 'app/public/js/student-app.js'
      - 'app/sql/development-reread-progress-not-for-production.sql'
      - 'app/tests/reread-student-flow.test.cjs'
      - 'app/tests/reread-api-transport-isolated.test.cjs'
      - 'app/tests/student-reread-feedback-ui.test.mjs'
      - 'app/tests/reread-student-api-chromium.py'
      - 'app/tests/isolated-postgres-reread-submission.sql'
      - 'app/sql/development-reread-publish-validation-not-for-production.sql'
      - 'app/tests/reread-publish-validation.test.cjs'
      - 'app/tests/reread-universal-contract.test.cjs'
      - 'app/public/js/student-app.js'
      - 'app/sql/development-reread-progress-not-for-production.sql'
      - 'app/tests/reread-student-integration.test.cjs'
      - '.github/workflows/reread-parent-warning-isolated.yml'
  workflow_dispatch:
jobs:
  reread-warning:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: reread_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d reread_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Node advisory threshold and failure cases
        run: node app/tests/reread-parent-warning.test.cjs
      - name: Chromium student API reread RPC sequence
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
          python app/tests/reread-student-api-chromium.py
      - name: Reread student feedback and unavailable status UI regressions
        run: node --test app/tests/student-reread-feedback-ui.test.mjs
      - name: Isolated reread completion API transport and denial cases
        run: node --test app/tests/reread-api-transport-isolated.test.cjs
      - name: Student submission to reread integration static assertions
        run: node app/tests/reread-student-integration.test.cjs
      - name: Student submission and reread flow static checks
        run: node app/tests/reread-student-flow.test.cjs
      - name: Publication answer-key validation static checks
        run: node app/tests/reread-publish-validation.test.cjs
      - name: Universal future-PDF reread contract
        run: node app/tests/reread-universal-contract.test.cjs
      - name: PostgreSQL student submission reread trigger and authorization
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -X -h 127.0.0.1 -U postgres -d reread_test -v ON_ERROR_STOP=1 -f app/tests/isolated-postgres-reread-submission.sql 2>&1 | tee reread-student.log
          grep -q 'REREAD_STUDENT_POSTGRES_ASSERTIONS_PASSED' reread-student.log
          PGPASSWORD=postgres createdb -h 127.0.0.1 -U postgres reread_parent_test
      - name: PostgreSQL parent lesson authorization and approval consistency
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -X -h 127.0.0.1 -U postgres -d reread_parent_test -v ON_ERROR_STOP=1 -f app/tests/isolated-postgres-parent-lesson.sql 2>&1 | tee reread-parent-lesson.log
          grep -q 'REREAD_PARENT_LESSON_POSTGRES_ASSERTIONS_PASSED' reread-parent-lesson.log

