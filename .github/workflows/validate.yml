name: Free validation
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cq-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  local-learning:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: python -m compileall -q -x 'node_modules|runtime' app
      - run: npm test
      - name: Read-only deployment asset integrity manifest regression (isolated)
        run: node app/tools/asset-integrity-audit.test.mjs
      - name: Parent publication answer-key validation (isolated)
        run: node app/tests/parent-publication-payload.test.mjs
      - name: Isolated PostgreSQL submission and feedback permission regression
        run: |
          npm install --prefix app/server-review --no-save --ignore-scripts --no-audit --no-fund
          node app/server-review/current-db.test.mjs
      - run: npm run build
        env:
          WRANGLER_SEND_METRICS: 'false'
      - name: Generate candidate asset SHA-256 inventory (read-only)
        run: |
          mkdir -p "$RUNNER_TEMP/cq-candidate-inventory"
          node app/tools/asset-integrity-audit.mjs > "$RUNNER_TEMP/cq-candidate-inventory/manifest.json"
          node -e 'const m=require(process.argv[1]); if(m.scope!=="repository-candidate-not-live-cloudflare"||!m.files.length)process.exit(1); console.log("CANDIDATE_ASSET_MANIFEST_GENERATED files="+m.files.length)' "$RUNNER_TEMP/cq-candidate-inventory/manifest.json"
      - name: Retain candidate SHA-256 inventory (no file contents)
        uses: actions/upload-artifact@v4
        with:
          name: cq-v4-candidate-asset-sha256
          path: ${{ runner.temp }}/cq-candidate-inventory/manifest.json
          if-no-files-found: error
          retention-days: 7
      - name: Stage Worker dry-run (never deploy)
        run: node app/tools/deploy-preflight.mjs --target stage
        env:
          WRANGLER_SEND_METRICS: 'false'
      - name: Production Worker dry-run (never deploy)
        run: node app/tools/deploy-preflight.mjs --target production
        env:
          WRANGLER_SEND_METRICS: 'false'
      - run: pip install -r app/qa-requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Parent 12-step isolated browser regression
        run: python app/parent_material_workflow_e2e.py "$RUNNER_TEMP/cq-parent-material"
      - name: Start isolated local Supabase, with no hosted project link
        working-directory: app
        run: |
          npx --no-install supabase --workdir local-supabase start --exclude realtime,imgproxy,studio,logflare,vector,supavisor,postgres-meta,mailpit > "$RUNNER_TEMP/supabase-start.log" 2>&1
          npx --no-install supabase --workdir local-supabase status -o json > "$RUNNER_TEMP/cq-local-status.json"
          chmod 600 "$RUNNER_TEMP/cq-local-status.json"
          nohup npx --no-install supabase --workdir local-supabase functions serve > "$RUNNER_TEMP/cq-functions.log" 2>&1 < /dev/null &
      - name: Install integrated SQL into disposable local Supabase only
        run: |
          set -euo pipefail
          DB_URL=$(python -c 'import json,os,urllib.parse; u=json.load(open(os.environ["RUNNER_TEMP"]+"/cq-local-status.json"))["DB_URL"]; p=urllib.parse.urlparse(u); assert p.hostname in ("127.0.0.1","localhost") and p.path=="/postgres"; print(u)')
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f app/sql/development-reread-progress-not-for-production.sql
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 <<'SQL'
          CREATE OR REPLACE FUNCTION public.cq_v4_lock_student_lesson_writes(p_student uuid)
          RETURNS void LANGUAGE sql VOLATILE SET search_path TO ''
          AS $$
            SELECT pg_catalog.pg_advisory_xact_lock(
              pg_catalog.hashtextextended(p_student::text, 731640)
            );
          $$;
          REVOKE ALL ON FUNCTION public.cq_v4_lock_student_lesson_writes(uuid)
            FROM PUBLIC, anon, authenticated;
          DROP TRIGGER IF EXISTS cq_v4_reread_after_submit ON public.cq_v4_student_submissions;
          SQL
          for sql in cq_v4_immutable_grading_snapshot v4-integrated-optional-answers v4-parent-frozen-result v4-parent-material-preview; do
            psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f "review/sql-candidates/$sql.REVIEW-ONLY.sql"
          done
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -c "NOTIFY pgrst, 'reload schema';"
          echo LOCAL_V4_INTEGRATED_SQL_INSTALLED
      - name: Real local Auth, Storage, Edge and learning flow
        run: |
          python app/local-supabase/full_browser_test.py "$RUNNER_TEMP/cq-local-status.json" "$RUNNER_TEMP/cq-full-txt/results.json" txt
          python app/local-supabase/full_browser_test.py "$RUNNER_TEMP/cq-local-status.json" "$RUNNER_TEMP/cq-full-pdf/results.json" pdf
          python app/local-supabase/full_browser_test.py "$RUNNER_TEMP/cq-local-status.json" "$RUNNER_TEMP/cq-full-range/results.json" range
          python app/local-supabase/full_browser_test.py "$RUNNER_TEMP/cq-local-status.json" "$RUNNER_TEMP/cq-full-whole/results.json" whole
      - name: Sanitized local startup diagnostics
        if: failure()
        run: python app/local-supabase/ci-diagnostics.py
      - name: Stop only the local test stack
        if: always()
        working-directory: app
        run: npx --no-install supabase --workdir local-supabase stop

  reread-postgres-boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: isolated-test-only
          POSTGRES_DB: cq_reread_boundary
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cq_reread_boundary"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: isolated-test-only
      PGDATABASE: cq_reread_boundary
    steps:
      - uses: actions/checkout@v4
      - name: Verify 60/70/80 percent, persisted reread completion and feedback authorization
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f app/tests/isolated-postgres-reread-submission.sql 2>&1 | tee /tmp/cq-reread-boundary.log
          grep -q 'REREAD_STUDENT_POSTGRES_ASSERTIONS_PASSED' /tmp/cq-reread-boundary.log

  isolated-atomic-postgres-review:
    name: Reuse isolated PostgreSQL atomic submission and frozen reread preflight
    uses: ./.github/workflows/chapter-quest-v4-isolated-preflight.yml
    permissions:
      contents: read
