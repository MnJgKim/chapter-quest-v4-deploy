name: Hosted readiness offline audit
on:
  pull_request:
    paths:
      - 'app/tools/hosted-readiness-audit.mjs'
      - 'app/worker.mjs'
      - 'wrangler.jsonc'
      - 'app/server-review/fixtures/live_schema.json'
      - 'app/server-review/fixtures/table_metadata.json'
      - '.github/workflows/hosted-readiness-offline.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Offline hosted contract audit (no credentials or remote writes)
        run: node app/tools/hosted-readiness-audit.mjs
