name: Hosted readiness offline audit
on:
  pull_request:
    paths:
      - 'app/tools/hosted-readiness-audit.mjs'
      - 'app/worker.mjs'
      - 'app/worker-ai-readiness.test.mjs'
      - 'app/audio-hosted-compatibility.test.mjs'
      - 'app/server-review/hosted-migration-dependency-gate.test.mjs'
      - 'app/server-review/auto-release-*.REVIEW.sql'
      - 'app/server-review/weekly-atomic-rpc.REVIEW.sql'
      - 'app/public/js/audio-vault.js'
      - 'app/public/js/student-app.js'
      - 'app/server-review/hosted-core-contract-readonly.REVIEW.sql'
      - 'app/server-review/hosted-storage-security-readonly.REVIEW.sql'
      - 'app/server-review/hosted-approval-readiness-readonly.REVIEW.sql'
      - 'wrangler.jsonc'
      - 'app/server-review/fixtures/live_schema.json'
      - 'app/server-review/fixtures/table_metadata.json'
      - '.github/workflows/hosted-readiness-offline.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Offline hosted contract audit (no credentials or remote writes)
        run: node app/tools/hosted-readiness-audit.mjs
      - name: Targeted AI disabled-mode tests (no model calls)
        run: node --test app/worker-ai-readiness.test.mjs
      - name: Offline audio and hosted Storage compatibility (no device or upload)
        run: node --test app/audio-hosted-compatibility.test.mjs
      - name: Hosted migration dependency and authorization gate (offline)
        run: node --test app/server-review/hosted-migration-dependency-gate.test.mjs
