name: Isolated release authorization regression
on:
  push:
    branches:
      - test/release-auth-isolated-20261116
  workflow_dispatch:
jobs:
  release-auth:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: app/server-review
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated test dependencies
        run: npm install --no-save --ignore-scripts
      - name: Run release authorization and Storage RLS regression
        run: node release-auth-isolated.test.mjs
